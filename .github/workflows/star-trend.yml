name: Update GitHub Star Trend

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-star-trend
  cancel-in-progress: true

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate star trend SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/generate_star_trend.py --output docs/assets/star-history.svg

      - name: Commit updated chart
        run: |
          if git diff --quiet -- docs/assets/star-history.svg; then
            echo "Star trend is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/star-history.svg
          git commit -m "chore: update GitHub star trend [skip ci]"
          git push
