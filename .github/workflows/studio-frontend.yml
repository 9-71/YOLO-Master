name: Studio Frontend

on:
  pull_request:
    paths: ["web/**", "frontend/**", "studio/ui/**", "f1/ui/**", "app.py", "start_studio.py", "tests/studio/**", "tests/f1/ui/**", "pyproject.toml", ".github/workflows/studio-frontend.yml"]
  push:
    branches: [main, "studio/**"]
    paths: ["web/**", "frontend/**", "studio/ui/**", "f1/ui/**", "app.py", "start_studio.py", "tests/studio/**", "tests/f1/ui/**", "pyproject.toml", ".github/workflows/studio-frontend.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-clients:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  python-clients-and-launcher:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      YOLO_AUTOINSTALL: "false"
      YOLO_OFFLINE: "true"
      NO_PROXY: "127.0.0.1,localhost,::1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[studio]" gradio pytest httpx ruff
      - run: python -m pytest tests/studio tests/f1/ui -q
      - run: ruff check studio/ui f1/ui app.py start_studio.py tests/studio
      - run: ruff format --check studio/ui f1/ui app.py start_studio.py tests/studio
