name: F1 CI (Lightweight)

on:
  push:
    branches:
      - main
      - rhino-f1-dev
  pull_request:
    branches:
      - main
      - rhino-f1-dev

permissions:
  contents: read

jobs:
  f1-lint-and-test:
    name: Lint & Test (smoke/f1 + core)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install lightweight toolchain
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov
          # 仅安装当前项目包结构（editable, no-deps），不拉取 torch/torchvision/ultralytics 等重量级依赖
          pip install -e . --no-deps || true

      - name: Ruff lint (restricted scope)
        run: ruff check smoke/ core/ app.py

      - name: Ruff format check (restricted scope)
        run: ruff format --check smoke/ core/ app.py

      - name: Run F1 unit tests with coverage
        run: |
          pytest smoke/f1/ \
            --cov=smoke/f1 \
            --cov=core \
            --cov-report=term-missing \
            --cov-report=xml
