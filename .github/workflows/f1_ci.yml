name: F1 CI (Lightweight)

on:
  push:
    branches:
      - main
      - rhino-f1-dev
  pull_request:
    branches:
      - main
      - rhino-f1-dev

permissions:
  contents: read

jobs:
  f1-lint-and-test:
    name: Lint & Test (smoke/f1 + core)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install toolchain and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only PyTorch wheels: small and fast to download on CI, sufficient for smoke tests
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          # Lightweight tooling and UI/schema dependencies required by smoke/f1 and core
          pip install ruff pytest pytest-cov pydantic gradio pyyaml
          # Install the local package structure only; runtime deps are provided by the steps above
          pip install -e . --no-deps || true
          # Best-effort install of the remaining runtime deps (opencv, numpy, pandas, etc.)
          pip install -r requirements.txt || true

      - name: Ruff lint (restricted scope)
        run: ruff check smoke/ core/ app.py

      - name: Ruff format check (restricted scope)
        run: ruff format --check smoke/ core/ app.py

      - name: Run F1 unit tests with coverage
        run: |
          pytest smoke/f1/ \
            --cov=smoke/f1 \
            --cov=core \
            --cov-report=term-missing \
            --cov-report=xml
