# YOLO-Master v0.10 MoT scene-aware experimental variant.
# This config preserves the v0.10 architecture while enabling the opt-in
# scene-statistics residual and a conservative consistency auxiliary loss.

nc: 80
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, VisualEnhancedAdaptiveGateMoE, [512, 4, 2, 0.5]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, VisualEnhancedAdaptiveGateMoE, [512, 8, 2, 0.5]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 4, A2C2f, [1024, True, 1]]
  - [-1, 1, VisualEnhancedAdaptiveGateMoE, [1024, 16, 2, 0.5]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 8], 1, Concat, [1]]
  # C2fMoT args append: sparse_train, scene_aware_router, scene_hidden_dim, scene_consistency_coeff,
  #                     sparse_train_warmup_steps, scene_inference_mode, local_attn_window, export_masked
  - [-1, 4, C2fMoT, [512, 8, 2, 7, 4, 2.0, 1.0, 0.01, 0.5, False, True, 8, 0.01, 0, "dynamic", 0, True]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 4, C2fMoT, [512, 8, 2, 7, 4, 2.0, 0.8, 0.01, 0.5, False, True, 8, 0.01, 0, "dynamic", 0, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 4, C2fMoT, [512, 8, 1, 7, 4, 2.0, 0.8, 0.01, 0.5, False, True, 8, 0.01, 0, "dynamic", 0, True]]
  - [[17, 20, 23], 1, Detect, [nc]]
