# YOLO-Master v0.15-tiny 🚀 AGPL-3.0 License - https://ultralytics.com/license
# Ultra-lightweight variant of v0.15 (GatedFusionMoE) for edge/mobile deployment.
#
# Design deltas vs yolo-master-n (v0.15):
#   - scale "tiny": depth 0.33 (all block repeats collapse to 1), width 0.125
#     (half of nano) — targets sub-1M-parameter models.
#   - Fewer, cheaper experts: switch-style top-1 routing at P3/P4 and P4/P5
#     junctions (2 experts each), top-2 routing with 4 experts only at P5
#     where features are most semantic. Expert counts are NOT width-scaled,
#     so they are reduced explicitly here.
#
# MoE args: [out_channels, num_experts, top_k, split_ratio]
# split_ratio per stage (same tuning as v0.15):
#   P3/P4 (layer 5): 0.5   — more dynamic capacity for fine-grained features
#   P4/P5 (layer 8): 0.5   — balanced
#   P5    (layer 11): 0.375 — more static capacity, feature map is small

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  # NOTE: must stay the first (only) entry — the master naming scheme has no
  # digit before the scale suffix, so parse_model falls back to scales[0].
  tiny: [0.33, 0.125, 1024]

# YOLO-Master-v0.15-tiny backbone with GatedFusionMoE
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]         # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]        # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2

  - [-1, 1, Conv, [256, 3, 2]]        # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4

  - [-1, 1, GatedFusionMoE, [512, 2, 1, 0.5]]   # 5 - MoE at P3/P4 junction (top-1, 2 experts)

  - [-1, 1, Conv, [512, 3, 2]]        # 6-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]    # 7

  - [-1, 1, GatedFusionMoE, [512, 2, 1, 0.5]]   # 8 - MoE at P4/P5 junction (top-1, 2 experts)

  - [-1, 1, Conv, [1024, 3, 2]]       # 9-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]   # 10

  - [-1, 1, GatedFusionMoE, [1024, 4, 2, 0.375]] # 11 - MoE at P5 (top-2, 4 experts)

# YOLO-Master-v0.15-tiny detection head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 8], 1, Concat, [1]]         # cat backbone P4
  - [-1, 2, C3k2, [512, True]]        # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]          # cat backbone P3
  - [-1, 2, C3k2, [256, True]]         # 17

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]         # cat head P4
  - [-1, 2, C3k2, [512, True]]         # 20

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]         # cat head P5
  - [-1, 2, C3k2, [512, True]]         # 23 (P5/32-large)

  - [[17, 20, 23], 1, Detect, [nc]]     # Detect(P3, P4, P5)
