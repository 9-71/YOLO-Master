# F09 alpha recipe: GT foreground-aware Foundation KD with a real DINOv3 teacher.
# Use HF_ENDPOINT=https://hf-mirror.com when the model is not already cached.
model: yolo26n.yaml
data: coco8.yaml
epochs: 1
imgsz: 64
batch: 2
workers: 0
device: cpu
project: runs/foundation
name: f09-foreground-coco8-dinov3
exist_ok: true
save: true
plots: false
val: false

foundation_enabled: true
foundation_teacher: dinov3
foundation_backend: transformers
foundation_model: Tooony133/dinov3-vits16-pretrain-lvd1689m
foundation_weights:
foundation_target_levels: [p4]
foundation_multiscale: false
foundation_align_dim: 32
foundation_loss: hybrid
foundation_loss_weight: 0.05
foundation_cosine_weight: 1.0
foundation_relation_weight: 1.0
foundation_relation_mode: sampled
foundation_relation_samples: 16
foundation_foreground_weighting: true
foundation_foreground_weight: 1.5
foundation_boundary_weight: 1.0
foundation_background_weight: 0.25
foundation_teacher_dtype: fp32
foundation_teacher_device: cpu
